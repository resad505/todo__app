<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,700;1,700&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital@0;1&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <script src="script.js" defer></script>
  <title>Frontend Mentor | Todo app</title>

  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));
    @theme {
        --font-sans-700: "Josefin Sans", sans-serif;
        --font-sans-400:"Josefin Sans", sans-serif;
        /* dark colors*/
        --color-navy-950: hsl(235, 21%, 11%);
        --color-navy-900: hsl(235, 24%, 19%);
        --color-purple-300: hsl(234, 39%, 85%);
        --color-purple-100: hsl(236, 33%, 92%);
        --color-purple-600: hsl(235, 16%, 43%);
        --color-purple-700: hsl(233, 14%, 35%);
        --color-purple-800: hsl(237, 14%, 26%);
        /* light colors */
        --color-gray-50: hsl(0, 0%, 98%);
        --color-gray-300: hsl(233, 11%, 84%);
        --color-gray-600: hsl(236, 9%, 61%);
        --color-navy-850: hsl(235, 19%, 35%);
        /* background colors*/
        --background-image-desktop-dark: url('./images/bg-desktop-dark.jpg');
        --background-image-desktop-light: url('./images/bg-desktop-light.jpg');
        --background-image-mobile-dark: url('./images/bg-mobile-dark.jpg');
        --background-image-mobile-light: url('./images/bg-mobile-light.jpg');
      }
    </style>
</head>

<body class=" bg-gray-50 dark:bg-navy-950 min-h-screen bg-mobile-light dark:bg-mobile-dark md:bg-desktop-light
  dark:md:bg-desktop-dark bg-no-repeat bg-top bg-[length:100%_200px] md:bg-[length:100%_300px]">
  <header class="h-52 md:h-72 bg-mobile-light dark:bg-mobile-dark  md:bg-desktop-light dark:md:bg-desktop-dark">
    <nav class=" flex flex-row items-center justify-between py-6 px-4 w-9/10 max-w-xl mx-auto">
      <h1 class="text-3xl font-sans-700 text-white tracking-[10px]">TODO</h1>
      <button id="color" aria-label="Toggle color theme" type="button">
        <img id="light" class="hidden dark:block" src="images/icon-sun.svg" alt="">
        <img id="dark" class="block dark:hidden" src="images/icon-moon.svg" alt="">
      </button>
    </nav>
  </header>
  <main class="-mt-24 md:-mt-32 relative z-10 max-w-xl mx-auto">
    <form action="" class="w-9/10  flex justify-center items-center m-auto">
      <input
        class=" m-auto dark:bg-navy-900 outline-none w-full bg-white dark:text-purple-300 text-navy-850 mt-10 py-2 px-4 rounded-md"
        type="text" placeholder="Create a new todo.." aria-label="Create a new todo">
      <button type="submit" class="sr-only">Add todo</button>
    </form>
    <section
      class="dark:bg-navy-900 bg-white dark:text-purple-300 text-purple-800  w-9/10 m-auto mt-10 rounded-md mb-24 md:mb-0"
      id="tasks">
      <ul class="flex flex-col justify-center">

      </ul>
      <section id="status" class="flex justify-between mt-4 py-2 px-4 text-gray-600 relative items-center">
        <div>
          <p><span id="items__left">0</span><span id="items__text"> items left</span></p>
        </div>
        <div
          class="absolute top-full left-0 w-full mt-4 flex gap-4 justify-center py-4 px-6 bg-white dark:bg-navy-900 rounded-md shadow-md md:static md:w-auto md:p-0 md:mt-0 md:bg-transparent md:dark:bg-transparent md:shadow-none font-sans-700 text-gray-600 dark:text-purple-600 cursor-pointer">
          <button type="button" id="all" class="hover:text-blue-500">All</button>
          <button type="button" id="activeTasks" class="hover:text-blue-500">Active</button>
          <button type="button" id="completedTasks" class="hover:text-blue-500">Completed</button>
        </div>

        <button type="button" class="cursor-pointer" id="clearCompletedBtn">Clear Completed</button>
      </section>

    </section>


  </main>
  <footer>
    <p class="text-center text-sm text-gray-500 dark:text-purple-600 mt-10">Drag and drop to reorder list</p>
    <p class="text-center text-xs text-gray-400 dark:text-purple-700 mt-4">
      Challenge by <a class="underline" href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a class="underline" href="https://www.frontendmentor.io/profile/resad505">Reshad Mammadov</a>.
    </p>

  </footer>
  <template id="todo-template">
    <li draggable="true"
      class="w-full flex justify-between items-center cursor-grab px-6 py-4 border-b border-gray-200 dark:border-purple-800 group">
      <div class="flex items-center gap-4">
        <button
          class="w-6 h-6 rounded-full border border-gray-300 dark:border-purple-800 flex items-center justify-center"
          data-action="toggle" aria-label="Toggle todo status"></button>
        <span class="todo-text"></span>
      </div>
      <button class="cursor-pointer opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity"
        data-action="delete" aria-label="Delete todo">
        <img alt="" class="w-4 h-4" src="images/icon-cross.svg">
      </button>
    </li>
  </template>

</body>

</html>
